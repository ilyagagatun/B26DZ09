<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Основы CSS</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        color: white;
      }
      p {
        width: 150px;
        height: 150px;
        background-color: cornflowerblue;
        border-radius: 0;
        margin: 20px;
        padding: 65px 45px;
      }
      p {
        border-radius: 100%;
      }
      .red {
        background-color: #ff0000;
      }
      .gold {
        background-color: gold;
      }
      .green {
        background-color: rgb(0, 134, 0);
      }
    </style>
  </head>
  <body>
    <p class="red">красный</p>
    <p class="gold">желтый</p>
    <p class="green">зеленый</p>
  </body>
</html>
