<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>основы css</title>
    <style>
      p {
        width: 150px;
        height: 150px;
        background-color: #be4b4b;
        border-radius: 0px;
        margin: 20px;
        padding: 65px 45px;
        border-radius: 90%;
      }
      .red {
        background-color: red;
      }
      .gold {
        background-color: gold;
      }
      .green {
        background-color: green;
      }
    </style>
  </head>
  <body>
    <p class="red">123</p>
    <p class="gold">123</p>
    <p class="green">123</p>
  </body>
</html>
